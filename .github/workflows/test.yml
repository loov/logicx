name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The app needs AppKit, so the tests that matter only run on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The library is meant to stay pure Go and portable.
      - run: GOOS=linux CGO_ENABLED=0 go build ./...
